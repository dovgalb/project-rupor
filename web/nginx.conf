map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — все unknown пути отдают index.html, чтобы react-router
  # сам разрулил клиентский роутинг (включая /rooms/:id/channels/:cid).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Прокси REST + WebSocket-upgrade на api-сервер.
  # Hybrid-схема (PR-3.5 Phase 10): api работает локально (make run на :8080),
  # web — в контейнере. host.docker.internal — это хост-машина из контейнера.
  # На Linux требуется extra_hosts: host-gateway в docker-compose.yml.
  location /api/v1/ {
    proxy_pass http://host.docker.internal:8080;
    proxy_http_version 1.1;

    # WebSocket upgrade.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Долгие WS-таймауты — реалтайм-чат может идти часами без активности.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # Security headers (минимальный набор для MVP).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
