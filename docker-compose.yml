services:
  postgres:
    image: postgres:16-alpine
    container_name: rupor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rupor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rupor}
      POSTGRES_DB: ${POSTGRES_DB:-rupor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - rupor-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rupor}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Hybrid (Phase 10): web — в контейнере, api по-прежнему `make run` локально.
  # nginx внутри контейнера проксирует /api/v1 на host.docker.internal:8080.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: rupor-web
    ports:
      - "${WEB_PORT:-3000}:80"
    extra_hosts:
      # На Docker Desktop (macOS/Windows) host.docker.internal работает из коробки,
      # на Linux его нужно явно зарезолвить в IP хоста.
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  rupor-pg-data:
